<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #f4f4f4;
      font-family: 'Roboto', sans-serif;
    }
    .header {
      background-color: #e53935;
      color: white;
      padding: 1rem;
      font-size: 2.5rem;
      font-weight: bold;
      text-align: center;
      letter-spacing: 8px;
    }
    .contact-form {
      max-width: 500px;
      margin: 3rem auto;
      background-color: #ddd;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    .form-control {
      border: 2px solid #e53935;
      background-color: white;
      color: #e53935;
      font-weight: bold;
      margin-bottom: 1.5rem;
      height: 50px;
    }
    .form-control::placeholder {
      color: #e53935;
      opacity: 0.8;
    }
    .form-control.textarea {
      height: 120px;
    }
    .btn-request {
      border: 2px solid #303f9f;
      background-color: white;
      font-weight: bold;
      width: 100%;
      padding: 0.75rem;
      transition: 0.2s ease;
    }
    .btn-request:hover {
      background-color: #e0e0e0;
    }
    .footer {
      background-color: #e53935;
      color: white;
      text-align: center;
      padding: 1rem;
      margin-top: 3rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="header">CONTACT</div>

  <div class="contact-form">
    <input type="text" class="form-control" placeholder="Name" id="name">
    <textarea class="form-control textarea" placeholder="Why" id="reason"></textarea>
    <button class="btn btn-request" onclick="submitRequest()">Request an account</button>
  </div>

  <div class="footer">Njohn8259@westada.org</div>

  <script>
    function submitRequest() {
      const name = document.getElementById("name").value.trim();
      const reason = document.getElementById("reason").value.trim();

      if (name === "" || reason === "") {
        alert("Please fill out both fields.");
        return;
      }

      alert("Request submitted!\nName: " + name + "\nReason: " + reason);
      window.location.href = "login.html"; // Redirect to login page after submission
    }
  </script>

</body>
</html>
