<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #f4f4f4;
      font-family: 'Roboto', sans-serif;
    }
    .header {
      background-color: #e53935;
      color: white;
      padding: 1rem;
      font-size: 2.5rem;
      font-weight: bold;
      text-align: center;
      letter-spacing: 5px;
    }
    .login-card {
      max-width: 500px;
      margin: 3rem auto;
      padding: 2rem;
      background-color: #ddd;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }
    .form-control {
      background-color: #03a9f4;
      color: white;
      border: none;
      font-weight: bold;
      text-align: center;
      margin-bottom: 1.5rem;
      height: 50px;
    }
    .form-control::placeholder {
      color: white;
      opacity: 0.9;
    }
    .btn-login {
      background-color: #43a047;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      width: 100%;
      padding: 0.75rem;
      transition: background-color 0.2s ease;
    }
    .btn-login:hover {
      background-color: #388e3c;
    }
    .signup-text {
      margin-top: 1rem;
      text-align: center;
      font-weight: bold;
    }
    .info-box {
      margin-top: 2rem;
      border: 2px solid black;
      padding: 1rem;
      text-align: center;
      font-weight: bold;
      background-color: white;
    }
  </style>
</head>
<body>

  <div class="header">LOGIN</div>

  <div class="login-card">
    <input type="text" id="username" class="form-control" placeholder="Username">
    <input type="password" id="password" class="form-control" placeholder="Password">
    <button class="btn btn-login" onclick="checkLogin()">Login</button>
    <a href="contact.html" style="text-decoration: none; color: black;">
        <div class="signup-text">Don't Have An Account?</div>
    </a>

    <div class="info-box">
      Find Your Files From Anywhere
    </div>
  </div>

  <script>
    // WHITELIST: Add username-password pairs here
    const whitelist = {
      "admin": "1234",
      "user1": "pass1",
      "john": "doe123"
    };

    function checkLogin() {
      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value;

      if (whitelist[user] && whitelist[user] === pass) {
        alert("Login successful!");
        window.location.href = "home.html"; // Redirect to home page
      } else {
        alert("Invalid username or password.");
      }
    }
  </script>

</body>
</html>
