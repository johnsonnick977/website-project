<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
    }
    .header {
      background-color: #e53935;
      color: white;
      padding: 1rem;
      font-size: 2rem;
      font-weight: bold;
      text-align: center;
      letter-spacing: 5px;
    }
    .dashboard {
      max-width: 600px;
      margin: 2rem auto;
      padding: 1rem;
      background-color: #ddd;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .card-custom {
      border: none;
      border-radius: 10px;
      font-weight: bold;
      text-align: center;
      padding: 1.5rem;
      color: white;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }
    .card-custom:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }
    .files {
      background-color: #43a047;
    }
    .quick-add {
      background-color: #388e3c;
    }
    .storage {
      background-color: #8e24aa;
    }
    .logout {
      background-color: #fb8c00;
    }
    a.card-link {
      text-decoration: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="header">EXPLORE</div>

  <div class="dashboard">
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <a href="files.html" class="card-link">
          <div class="card card-custom files">FILES</div>
        </a>
      </div>
      <div class="col-md-6">
        <div class="card card-custom storage">26%<br>USED</div>
      </div>
    </div>
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <input type="file" id="quickAddInput" webkitdirectory directory multiple hidden>
<div class="card card-custom quick-add" onclick="document.getElementById('quickAddInput').click();">
  QUICK<br>ADD
</div>
      </div>
      <div class="col-md-6">
        <a href="login.html" class="card-link">
          <div class="card card-custom logout" onclick="logout()">LOGOUT</div>
      </a>
      </div>
    </div>
  </div>
  <script>
    function logout() {
      alert('Logging out...');
      window.location.href = '/login.html';
    }
  </script>
</body>
</html>
