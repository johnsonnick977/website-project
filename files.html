<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>File Explorer - Nested View</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #f4f4f4;
      padding: 2rem;
      font-family: 'Roboto', sans-serif;
    }
    .header {
      background-color: #43a047;
      color: white;
      padding: 1rem;
      font-size: 1.5rem;
      font-weight: bold;
      text-align: center;
      border-radius: 8px;
      margin-bottom: 1.5rem;
    }
    .tree {
      background-color: white;
      border-radius: 10px;
      padding: 1rem;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      max-height: 500px;
      overflow-y: auto;
    }
    ul {
      list-style-type: none;
      padding-left: 1rem;
    }
    .folder::before {
      content: "📁 ";
    }
    .file::before {
      content: "📄 ";
    }
    .toggle {
      cursor: pointer;
      user-select: none;
    }
    .nested {
      display: none;
    }
    .active {
      display: block;
    }
    .storage-info {
      margin-top: 1rem;
      text-align: right;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="header">File Explorer</div>

  <div class="mb-3">
    <input type="file" id="fileInput" webkitdirectory directory multiple class="form-control" />
  </div>

  <div class="tree" id="fileTree"></div>

  <div class="storage-info" id="storageInfo">
    Storage Used: 0 MB / 500 MB
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const fileTree = document.getElementById('fileTree');
    const storageInfo = document.getElementById('storageInfo');

    let totalUsed = 0;

    function formatSize(size) {
      const sizeInMB = size / (1024 * 1024);
      return sizeInMB >= 1024 
        ? (sizeInMB / 1024).toFixed(1) + ' GB' 
        : sizeInMB.toFixed(1) + ' MB';
    }

    function createTreeFromPaths(files) {
      const root = {};

      files.forEach(file => {
        const parts = file.webkitRelativePath.split('/');
        let current = root;

        parts.forEach((part, index) => {
          if (index === parts.length - 1) {
            current[part] = { __file: file }; // it's a file
          } else {
            current[part] = current[part] || {};
            current = current[part];
          }
        });
      });

      return root;
    }

    function buildList(obj) {
      const ul = document.createElement('ul');

      for (const name in obj) {
        const li = document.createElement('li');

        if (obj[name].__file) {
          li.className = 'file';
          li.textContent = `${name} - ${formatSize(obj[name].__file.size)}`;
        } else {
          li.className = 'folder toggle';
          li.textContent = name;

          const children = buildList(obj[name]);
          children.classList.add('nested');

          li.addEventListener('click', function (e) {
            e.stopPropagation();
            children.classList.toggle('active');
          });

          li.appendChild(children);
        }

        ul.appendChild(li);
      }

      return ul;
    }

    fileInput.addEventListener('change', () => {
      fileTree.innerHTML = '';
      totalUsed = 0;

      const files = Array.from(fileInput.files);
      files.forEach(file => totalUsed += file.size / (1024 * 1024));

      const tree = createTreeFromPaths(files);
      const treeElement = buildList(tree);
      treeElement.classList.add('active');
      fileTree.appendChild(treeElement);

      const displayedSize = totalUsed >= 1024 
        ? (totalUsed / 1024).toFixed(1) + ' GB' 
        : totalUsed.toFixed(1) + ' MB';

      storageInfo.textContent = `Storage Used: ${displayedSize} / 500 MB`;
    });
  </script>

</body>
</html>
